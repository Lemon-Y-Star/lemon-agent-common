server:
  port: 18090

spring:
  datasource:
    # NAS 上的 MySQL（Docker 容器 lemon-mysql，宿主端口 13306）；账号密码走环境变量，默认值仅本地开发用
    url: jdbc:mysql://192.168.5.250:13306/lemon_agent?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${LEMON_DB_USER:root}
    password: ${LEMON_DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

lemon:
  # 连接密钥的 AES-256 加密密钥（Base64 32 字节）；生产从环境变量/密管系统注入，禁止提交真实值
  crypto:
    secret: ${LEMON_CRYPTO_SECRET:Y9tV2wK7qFzP3mXaR8uE5sB1nC6dH0jL4gT2yVoQxZk=}
  # 知识检索（v2.3）：embedding 平台级凭据（用户 BYOK 代理未必有 embeddings 渠道）
  retrieval:
    # OpenAI 兼容 embeddings 端点/凭据/模型；未配置时 search_docs 不注册
    embedding-base-url: ${LEMON_EMBEDDING_BASE_URL:}
    embedding-api-key: ${LEMON_EMBEDDING_API_KEY:}
    embedding-model: ${LEMON_EMBEDDING_MODEL:}
    # NAS PgVector（middleware-pgvector 容器，宿主 15432）
    pgvector-url: ${LEMON_PGVECTOR_URL:jdbc:postgresql://192.168.5.250:15432/lemon_agent}
    pgvector-username: ${LEMON_PGVECTOR_USER:postgres}
    pgvector-password: ${LEMON_PGVECTOR_PASSWORD:LangchatPg2026}
  runtime:
    # 工具审批超时（秒）：BLOCKED 超过该时长未审批 → run_failed(APPROVAL_TIMEOUT)
    approval-timeout-seconds: 300
  tools:
    # 审批名单：名单内工具挂起等审批，名单外直接执行（显式白名单 + 默认拒绝）
    approval-required: create_ticket
  model-conn:
    # baseUrl 主机白名单（PRD FR-13 allowedHosts）；逗号分隔
    allowed-hosts: api.siliconflow.cn,api.deepseek.com,api.openai.com,dashscope.aliyuncs.com,apis.itedus.cn,api.shuaiapi.com,localhost,127.0.0.1
    auxiliary-purposes: 路由、规划及摘要等辅助对话,知识索引与检索向量,重排

# 登录会话：Sa-Token
# token-name=Authorization + token-prefix=Bearer：与前端「Authorization: Bearer <token>」约定对齐，
# 前端与拦截器代码不感知 Sa-Token 的默认 satoken 头
sa-token:
  token-name: Authorization
  token-prefix: Bearer
  timeout: 28800          # 8 小时有效
  active-timeout: -1      # 不做"无操作过期"（v1 语义：固定时长）
  is-concurrent: true     # 允许同一账号多端同时在线
  is-share: false         # 每次登录签发新令牌（不共享旧令牌）
  is-read-cookie: false   # v1 纯 Header 传输，不写 Cookie
  token-style: uuid
  is-log: true

logging:
  level:
    com.lemon.lemonagent: INFO
    com.lemon.architecture: INFO
